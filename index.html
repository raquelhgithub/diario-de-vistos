<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diário de Vistos e Controle - Prof. Raquel</title>
  <style>
    :root {
      --primary-color: #1e293b;
      --secondary-color: #0284c7;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-color: #0f172a;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 5px 0;
      color: var(--primary-color);
    }

    .subtitle {
      color: #64748b;
      margin: 0;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    select, input {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border: 1px solid var(--border-color);
    }

    th {
      background-color: #f1f5f9;
      color: var(--primary-color);
      font-weight: 600;
    }

    .badge-evento {
      background-color: #fef3c7;
      color: #92400e;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
      display: block;
      margin-top: 4px;
    }

    .visto-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--secondary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="prof-nome">Diário de Vistos</h1>
      <p class="subtitle">Controle de entregas e visto de atividades por aula</p>
    </header>

    <div class="controls">
      <div class="form-group">
        <label for="select-turma">Turma:</label>
        <select id="select-turma" onchange="renderizarAulas()">
          <option value="">Selecione uma turma...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="aluno-nome">Nome do Aluno(a):</label>
        <input type="text" id="aluno-nome" placeholder="Digite o nome do aluno...">
      </div>
    </div>

    <div class="table-container">
      <table id="tabela-vistos">
        <thead>
          <tr>
            <th>Data</th>
            <th>Dia / Bimestre</th>
            <th>Qtd. Aulas</th>
            <th>Evento / Observação</th>
            <th style="text-align: center;">Visto Concedido</th>
            <th>Anotações da Aula</th>
          </tr>
        </thead>
        <tbody id="lista-aulas-corpo">
          <tr>
            <td colspan="6" style="text-align: center; color: #64748b;">Selecione uma turma para carregar as datas das aulas.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="salvarVistos()">Salvar Registro de Vistos</button>
    </div>
  </div>

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("prof-nome").innerText = `Diário de Vistos - Prof. ${PROFESSOR_DATA.nome}`;
      const select = document.getElementById("select-turma");

      Object.keys(PROFESSOR_DATA.turmas).forEach(turma => {
        const option = document.createElement("option");
        option.value = turma;
        option.textContent = turma;
        select.appendChild(option);
      });
    });

    function renderizarAulas() {
      const turma = document.getElementById("select-turma").value;
      const tbody = document.getElementById("lista-aulas-corpo");
      tbody.innerHTML = "";

      if (!turma) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #64748b;">Selecione uma turma para carregar as datas das aulas.</td></tr>';
        return;
      }

      const aulas = PROFESSOR_DATA.turmas[turma];

      aulas.forEach((aula, idx) => {
        const tr = document.createElement("tr");

        const eventoTag = aula.eventoGeral 
          ? `<span class="badge-evento">${aula.eventoGeral}</span>` 
          : "";

        tr.innerHTML = `
          <td><strong>${aula.data}</strong></td>
          <td>${aula.diaSemana}<br><small style="color:#64748b">${aula.bimestre}</small></td>
          <td>${aula.qtdAulas}</td>
          <td>${eventoTag || "-"}</td>
          <td style="text-align: center;">
            <input type="checkbox" class="visto-checkbox" id="visto-${idx}">
          </td>
          <td>
            <input type="text" id="obs-${idx}" placeholder="Ex: Tarefa pg. 42 / Entrega do relatório" style="width: 90%;">
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function salvarVistos() {
      const turma = document.getElementById("select-turma").value;
      const aluno = document.getElementById("aluno-nome").value;

      if (!turma) {
        alert("Por favor, selecione uma turma.");
        return;
      }

      if (!aluno) {
        alert("Por favor, digite o nome do aluno.");
        return;
      }

      const aulas = PROFESSOR_DATA.turmas[turma];
      const registros = aulas.map((aula, idx) => {
        return {
          data: aula.data,
          visto: document.getElementById(`visto-${idx}`).checked,
          observacao: document.getElementById(`obs-${idx}`).value
        };
      });

      const dadosSalvos = {
        professor: PROFESSOR_DATA.nome,
        turma: turma,
        aluno: aluno,
        registros: registros
      };

      console.log("Registro de Vistos:", dadosSalvos);
      alert(`Vistos salvos com sucesso para o aluno(a) ${aluno} (${turma})! Check os dados no console.`);
    }
  </script>
