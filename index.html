<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano de Aulas - Prof. Raquel</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --background-color: #f4f6f9;
      --card-background: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-background);
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      font-size: 16px;
      background-color: #fff;
    }

    .aulas-container {
      margin-top: 25px;
    }

    .aula-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background-color: #fafafa;
      transition: border-color 0.2s;
    }

    .aula-card:focus-within {
      border-color: var(--secondary-color);
    }

    .aula-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      font-weight: bold;
      color: var(--primary-color);
    }

    .badge {
      background-color: var(--secondary-color);
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
    }

    .evento-alerta {
      background-color: #fff3cd;
      color: #856404;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 10px;
      border: 1px solid #ffeeba;
    }

    textarea {
      width: 100%;
      height: 60px;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
    }

    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #219150;
    }
  </style>
</head>

  <div class="container">
    <h1 id="titulo-doc">Plano de Aulas</h1>

    // Inicialização da interface
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("titulo-doc").innerText = `Plano de Aulas - Prof. ${PROFESSOR_DATA.nome}`;
      const select = document.getElementById("select-turma");

      // Preenche o select com as turmas disponíveis
      Object.keys(PROFESSOR_DATA.turmas).forEach(turma => {
        const option = document.createElement("option");
        option.value = turma;
        option.textContent = turma;
        select.appendChild(option);
      });
    });

    // Função para carregar as datas da turma selecionada
    function carregarAulas() {
      const turma = document.getElementById("select-turma").value;
      const container = document.getElementById("lista-aulas");
      const btnSalvar = document.getElementById("btn-salvar");
      
      container.innerHTML = "";

      if (!turma) {
        btnSalvar.style.display = "none";
        return;
      }

      const aulas = PROFESSOR_DATA.turmas[turma];

      aulas.forEach((aula, idx) => {
        const card = document.createElement("div");
        card.className = "aula-card";

        const eventoHtml = aula.eventoGeral 
          ? `<div class="evento-alerta"><strong>Evento:</strong> ${aula.eventoGeral}</div>` 
          : "";

        card.innerHTML = `
          <div class="aula-header">
            <span>${aula.data} (${aula.diaSemana})</span>
            <span class="badge">${aula.bimestre} | ${aula.qtdAulas} aula(s)</span>
          </div>
          ${eventoHtml}
          <div>
            <label for="conteudo-${idx}">Conteúdo / Atividade:</label>
            <textarea id="conteudo-${idx}" name="conteudo_${idx}" placeholder="Digite o conteúdo previsto para esta aula..."></textarea>
          </div>
        `;
        container.appendChild(card);
      });

      btnSalvar.style.display = "block";
    }

    // Função de submissão do formulário
    function salvarPlano(event) {
      event.preventDefault();
      const turma = document.getElementById("select-turma").value;
      const aulas = PROFESSOR_DATA.turmas[turma];
      
      const resultado = aulas.map((aula, idx) => {
        const conteudo = document.getElementById(`conteudo-${idx}`).value;
        return {
          ...aula,
          conteudoPlanejado: conteudo
        };
      });

      console.log("Planejamento Salvo:", resultado);
      alert(`Planejamento da turma ${turma} salvo com sucesso! (Verifique o console para os dados exportados)`);
    }
  </script>
